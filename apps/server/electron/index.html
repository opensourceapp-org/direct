<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Direct server</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <p class="mark">Direct</p>
    <h1>Your server</h1>
    <p class="lead">Start it on this computer. Share the address with both phones. This window lists each phone that connects. Messages stay on the phones.</p>
  </header>

  <section class="panel" id="setup">
    <label for="port">Port</label>
    <div class="row">
      <input id="port" type="number" min="1" max="65535" value="8787" />
      <button id="toggle" type="button">Start server</button>
    </div>
    <p id="error" class="error" hidden></p>
  </section>

  <section class="panel" id="share" hidden>
    <h2>Share this address</h2>
    <p class="hint">Save the same address on both phones, under Network.</p>
    <ul id="urls"></ul>
  </section>

  <section class="panel">
    <h2>Connected phones</h2>
    <ul id="users"></ul>
    <p id="empty" class="hint">No phones connected yet.</p>
  </section>

  <script src="app.js"></script>
</body>
</html>
