<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>DIRECT</title>
    <script>
      try {
        var stored = JSON.parse(localStorage.getItem('direct.preferences') || '{}');
        var mode = stored.theme || 'system';
        var dark = mode === 'dark' || (mode !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.style.background = dark ? '#000000' : '#ffffff';
      } catch (error) {}
    </script>
    <style>
      html, body, #root { height: 100%; margin: 0; }
      body { font-family: 'Geist Sans', Inter, ui-sans-serif, system-ui, sans-serif; }
      #root { display: flex; min-height: 100%; }
      #root > div { display: flex; flex: 1; min-height: 0; min-width: 0; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.web.tsx"></script>
  </body>
</html>
